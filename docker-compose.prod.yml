name: crm

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  dns:
    - 8.8.8.8
    - 1.1.1.1
  volumes:
    - ./:/var/www/html
    - php_storage:/var/www/html/storage
    - ./storage/app/public:/var/www/html/storage/app/public
    - php_cache:/var/www/html/bootstrap/cache
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    - ./docker/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
    - ./docker/php/entrypoint.sh:/usr/local/bin/entrypoint:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - crm

services:
  app:
    <<: *app-base
    container_name: crm_app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --no-interaction 2>/dev/null || php -r 'exit(0);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://crm.local}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm}
      DB_USERNAME: ${DB_USERNAME:-crm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      OPCACHE_VALIDATE_TIMESTAMPS: "0"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      REVERB_HOST: ${REVERB_HOST:-0.0.0.0}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

  webserver:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - php_storage:/var/www/html/storage:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - crm

  db:
    image: postgres:17-alpine
    container_name: crm_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
    environment:
      POSTGRES_DB: ${DB_DATABASE:-crm}
      POSTGRES_USER: ${DB_USERNAME:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-crm} -d ${DB_DATABASE:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm

  redis:
    image: redis:8.10.1-alpine
    container_name: crm_redis
    restart: unless-stopped
    command: >
      sh -c "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm

  queue:
    <<: *app-base
    container_name: crm_queue
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm}
      DB_USERNAME: ${DB_USERNAME:-crm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      OPCACHE_VALIDATE_TIMESTAMPS: "0"
      QUEUE_CONNECTION: redis
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crm_reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--port=6001"]
    volumes:
      - ./:/var/www/html:ro
      - php_storage:/var/www/html/storage
      - ./storage/app/public:/var/www/html/storage/app/public
      - php_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 6001
      REVERB_SCHEME: http
      REVERB_APP_ID: ${REVERB_APP_ID:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  scheduler:
    <<: *app-base
    container_name: crm_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-crm}
      DB_USERNAME: ${DB_USERNAME:-crm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      OPCACHE_VALIDATE_TIMESTAMPS: "0"
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  php_storage:
  php_cache:

networks:
  crm:
    driver: bridge

