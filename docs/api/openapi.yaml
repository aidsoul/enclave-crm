openapi: 3.1.0
info:
  title: Enclave CRM API
  description: |
    Спецификация REST API для Enclave CRM.
    
    Включает:
    - **Внешнее API интеграции** (`POST /api/orders/incoming`, `POST /api/leads/incoming`) для приема данных с интернет-магазинов и посадочных страниц.
    - **Внутреннее API TMA** для работы интерфейса Telegram Mini App.
  version: 1.0.0
  contact:
    name: AidSoul
    email: work-aidsoul@outlook.com

servers:
  - url: http://localhost:8080
    description: Локальный Docker-окружение
  - url: https://crm.example.com
    description: Production сервер

tags:
  - name: External Integration
    description: Прием заказов и заявок с внешних сайтов
  - name: Catalog Integration
    description: Синхронизация каталога товаров и вариантов с внешних интернет-магазинов
  - name: Auth
    description: Авторизация через Telegram initData и управление сессиями
  - name: Orders
    description: Управление заказами, смена статусов, комментарии, bulk-операции
  - name: Customers
    description: База покупателей, LTV, теги, черный список
  - name: Leads
    description: Входящие заявки (лиды) с сайтов и их конвертация в заказы
  - name: Products
    description: Каталог товаров и управление ценами
  - name: Personnel
    description: Управление сотрудниками, курьеры, блокировка
  - name: Sites
    description: Сайты-источники и управление токенами
  - name: Invitations
    description: Пригласительные ссылки для сотрудников
  - name: Dashboard & Analytics
    description: Финансовые отчеты, KPI персонала, экспорт данных
  - name: Settings
    description: Настройки системы и персональные уведомления
  - name: Audit
    description: Журнал аудита действий сотрудников
  - name: Emergency
    description: Экстренная очистка данных (Emergency Wipe)

paths:
  /api/orders/incoming:
    post:
      tags:
        - External Integration
      summary: Прием заказа с внешнего сайта
      description: |
        Асинхронный прием заказа из интернет-магазина.
        Требует заголовок `X-API-Token`. Заказы обрабатываются в очереди `ProcessIncomingOrderJob`.
      security:
        - SiteApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingOrderRequest'
      responses:
        '200':
          description: Заказ успешно принят в очередь
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order queued successfully
                  external_id:
                    type: string
                    example: 'ORD-10492'
        '401':
          description: Отсутствует заголовок X-API-Token
        '403':
          description: Недействительный X-API-Token
        '422':
          description: Ошибка валидации полей
        '429':
          description: Превышен лимит запросов (60 запросов в минуту)

  /api/leads/incoming:
    post:
      tags:
        - External Integration
      summary: Прием заявки (лида) с формы сайта
      description: |
        Прием заявок с форм («Заказать звонок», «Вопрос по товару», «Купить в 1 клик»).
      security:
        - SiteApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingLeadRequest'
      responses:
        '200':
          description: Заявка успешно принята в очередь
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lead queued successfully
        '401':
          description: Отсутствует X-API-Token
        '403':
          description: Недействительный токен
        '422':
          description: Ошибка валидации

  /api/catalog/sync:
    post:
      tags:
        - Catalog Integration
      summary: Пакетная синхронизация каталога товаров
      description: |
        Выгрузка товаров интернет-магазина в CRM (до 500 товаров в запросе).
        Поддерживает синхронную обработку или асинхронную через очередь при `"async": true`.
      security:
        - SiteApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogSyncRequest'
      responses:
        '200':
          description: Каталог успешно синхронизирован (синхронный режим)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Каталог успешно синхронизирован
                  synced_products:
                    type: integer
                    example: 25
                  synced_variants:
                    type: integer
                    example: 60
        '202':
          description: Каталог поставлен в очередь (асинхронный режим)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Каталог поставлен в очередь на синхронизацию
                  job_id:
                    type: string
                    example: catalog_sync_654e12ab89c0
        '401':
          description: Отсутствует X-API-Token
        '403':
          description: Недействительный токен сайта
        '422':
          description: Ошибка валидации структуры или данных
        '429':
          description: Превышен лимит запросов (60 запросов в минуту)

  /api/catalog/products:
    post:
      tags:
        - Catalog Integration
      summary: Создание или обновление одного товара с вариантами
      description: |
        Создание или обновление товара при изменении на сайте.
        Автоматически переводит в архив отсутствующие в запросе варианты.
      security:
        - SiteApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogProductInput'
      responses:
        '200':
          description: Товар успешно сохранен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Товар успешно сохранен
                  product:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Отсутствует X-API-Token
        '403':
          description: Недействительный токен сайта
        '422':
          description: Ошибка валидации данных товара
        '429':
          description: Превышен лимит запросов (60 запросов в минуту)

  /api/catalog/products/{externalId}:
    delete:
      tags:
        - Catalog Integration
      summary: Удаление или архивация товара каталога
      description: |
        Удаление товара. Если товар использовался в заказах, он и его варианты архивируются (`is_active: false`), сохраняя целостность заказов.
      security:
        - SiteApiToken: []
      parameters:
        - name: externalId
          in: path
          required: true
          schema:
            type: string
          description: Внешний ID товара на сайте
      responses:
        '200':
          description: Товар удален или архивирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Товар архивирован, так как он используется в заказах
                  archived:
                    type: boolean
                    example: true
                  deleted:
                    type: boolean
                    example: false
        '401':
          description: Отсутствует X-API-Token
        '403':
          description: Недействительный токен сайта
        '404':
          description: Товар не найден
        '429':
          description: Превышен лимит запросов (60 запросов в минуту)

  /api/auth/tma:
    post:
      tags:
        - Auth
      summary: Вход в систему через Telegram Mini App
      description: Валидация криптографической подписи Telegram initData и создание сессии в Redis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - init_data
              properties:
                init_data:
                  type: string
                  description: Сырая строка window.Telegram.WebApp.initData
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Подпись недействительна или пользователь не в белом списке

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Текущий авторизованный пользователь
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Завершение сессии (Logout)
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/orders:
    get:
      tags:
        - Orders
      summary: Список заказов с фильтрацией и пагинацией
      security:
        - TmaSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [new, accepted, at_warehouse, delivering, completed, cancelled]
        - name: search
          in: query
          schema:
            type: string
        - name: courier_id
          in: query
          schema:
            type: integer
        - name: manager_id
          in: query
          schema:
            type: integer
        - name: site_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Пагинированный список заказов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Orders
      summary: Ручное создание заказа (Owner, Manager)
      security:
        - TmaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{order}:
    get:
      tags:
        - Orders
      summary: Детальная информация о заказе
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

    patch:
      tags:
        - Orders
      summary: Обновление параметров заказа
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{order}/accept:
    patch:
      tags:
        - Orders
      summary: Принятие заказа менеджером в работу
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{order}/assign:
    patch:
      tags:
        - Orders
      summary: Назначение курьера на заказ
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courier_id
              properties:
                courier_id:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{order}/complete:
    patch:
      tags:
        - Orders
      summary: Завершение заказа (вручение клиенту и прием оплаты)
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{order}/delivery-proof:
    post:
      tags:
        - Orders
      summary: Загрузка фотофиксации вручения заказа курьером с камеры смартфона
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                  description: Фотография вручения заказа (JPEG, PNG, WEBP, HEIC, до 10 МБ)
      responses:
        '200':
          description: Фотофиксация успешно сохранена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  photo_proof_url:
                    type: string
                  photo_proof_at:
                    type: string
                    format: date-time
                  order:
                    $ref: '#/components/schemas/Order'

  /api/orders/{order}/delivery-signature:
    post:
      tags:
        - Orders
      summary: Загрузка цифровой подписи клиента (HTML5 Canvas) при вручении заказа
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - signature
              properties:
                signature:
                  type: string
                  format: binary
                  description: Изображение подписи получателя (PNG, WEBP, до 1 МБ)
      responses:
        '200':
          description: Подпись успешно сохранена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  signature_url:
                    type: string
                  signature_at:
                    type: string
                    format: date-time
                  order:
                    $ref: '#/components/schemas/Order'
        '403':
          description: Доступ запрещен (не назначен курьером на заказ)
        '422':
          description: Ошибка валидации файла подписи
    delete:
      tags:
        - Orders
      summary: Удаление подписи клиента
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Подпись успешно удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '403':
          description: Доступ запрещен (не назначен курьером на этот заказ)
        '422':
          description: Ошибка валидации изображения
    delete:
      tags:
        - Orders
      summary: Удаление фотофиксации вручения заказа
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Фотофиксация успешно удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'

  /api/orders/{order}/delivery-signature:
    post:
      tags:
        - Orders
      summary: Загрузка цифровой подписи клиента (HTML5 Canvas) при вручении заказа
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - signature
              properties:
                signature:
                  type: string
                  format: binary
                  description: Изображение подписи получателя (PNG, WEBP, до 1 МБ)
      responses:
        '200':
          description: Подпись успешно сохранена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  signature_url:
                    type: string
                  signature_at:
                    type: string
                    format: date-time
                  order:
                    $ref: '#/components/schemas/Order'
        '403':
          description: Доступ запрещен (не назначен курьером на заказ)
        '422':
          description: Ошибка валидации файла подписи
    delete:
      tags:
        - Orders
      summary: Удаление подписи клиента
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Подпись успешно удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'

  /api/orders/{order}/cancel:
    patch:
      tags:
        - Orders
      summary: Отмена заказа
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{order}/comments:
    get:
      tags:
        - Orders
      summary: Список комментариев к заказу
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderComment'

    post:
      tags:
        - Orders
      summary: Добавление комментария к заказу
      security:
        - TmaSession: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderComment'

  /api/customers:
    get:
      tags:
        - Customers
      summary: Список клиентов с LTV и фильтрами
      security:
        - TmaSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: search
          in: query
          schema:
            type: string
        - name: is_blacklisted
          in: query
          schema:
            type: boolean
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /api/customers/{id}:
    get:
      tags:
        - Customers
      summary: Карточка клиента с историей заказов
      security:
        - TmaSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

    patch:
      tags:
        - Customers
      summary: Обновление карточки клиента (теги, черный список)
      security:
        - TmaSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                address:
                  type: string
                is_blacklisted:
                  type: boolean
                blacklist_reason:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /api/products:
    get:
      tags:
        - Products
      summary: Список товаров
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags:
        - Products
      summary: Создание товара в каталоге
      security:
        - TmaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Получение детальной карточки товара с вариантами
      description: |
        Возвращает товар с привязанным сайтом и списком вариантов.
        Для роли `courier` финансовые поля (`cost_price`, `margin`, `purchase_price`) скрыты (`null`).
      security:
        - TmaSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Внутренний ID товара в CRM
      responses:
        '200':
          description: Детальная информация о товаре
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          description: Не авторизован
        '404':
          description: Товар не найден

  /api/personnel:
    get:
      tags:
        - Personnel
      summary: Список сотрудников
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/personnel/couriers:
    get:
      tags:
        - Personnel
      summary: Список курьеров для назначения
      description: Возвращает активных курьеров с текущим количеством активных доставок.
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    active_orders_count:
                      type: integer

  /api/sites:
    get:
      tags:
        - Sites
      summary: Список подключенных сайтов
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'

    post:
      tags:
        - Sites
      summary: Подключение нового сайта
      security:
        - TmaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - domain
              properties:
                name:
                  type: string
                domain:
                  type: string
                default_purchase_percent:
                  type: number
                  default: 15
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'

  /api/sites/{site}/rotate-token:
    post:
      tags:
        - Sites
      summary: Ротация API-токена сайта
      security:
        - TmaSession: []
      parameters:
        - name: site
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'

  /api/dashboard/stats:
    get:
      tags:
        - Dashboard & Analytics
      summary: Финансовая сводка (выручка, чистая прибыль, затраты)
      security:
        - TmaSession: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, yesterday, week, month, all, custom]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialStats'

  /api/dashboard/kpi:
    get:
      tags:
        - Dashboard & Analytics
      summary: KPI менеджеров и курьеров
      security:
        - TmaSession: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [managers, couriers]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /api/settings:
    get:
      tags:
        - Settings
      summary: Все доступные настройки
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  /api/settings/{key}:
    post:
      tags:
        - Settings
      summary: Обновление настройки
      security:
        - TmaSession: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/emergency-wipe/initiate:
    post:
      tags:
        - Emergency
      summary: Запрос на инициацию экстренной очистки
      description: Отправляет запрос на подтверждение экстренного удаления базы, кэша и логов.
      security:
        - TmaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pin_required

  /api/emergency-wipe/execute:
    post:
      tags:
        - Emergency
      summary: Выполнение экстренного уничтожения данных
      security:
        - TmaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wipe_token
                - confirm_code
              properties:
                wipe_token:
                  type: string
                confirm_code:
                  type: string
                delete_backups:
                  type: boolean
                  default: false
                  description: Безвозвратное удаление локальных архивов и бэкапов в S3
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  backups_purged:
                    type: boolean
                    example: true

  /api/emergency-wipe/confirm:
    post:
      tags:
        - Emergency
      summary: Подтверждение экстренной очистки PIN-кодом
      security:
        - TmaSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pin
              properties:
                pin:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

components:
  securitySchemes:
    SiteApiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: API-токен сайта (UUID), сгенерированный в CRM в разделе «Сайты».
    TmaSession:
      type: apiKey
      in: header
      name: X-TMA-Session
      description: Токен сессии Telegram Mini App.

  schemas:
    IncomingOrderRequest:
      type: object
      required:
        - order_items
      properties:
        external_id:
          type: string
          description: ID заказа во внешней CMS (номер на сайте)
          example: '10492'
        client_name:
          type: string
          example: 'Иван Иванов'
        client_phone:
          type: string
          example: '+79991234567'
        client_email:
          type: string
          example: 'ivan@example.com'
        client_address:
          type: string
          example: 'г. Москва, ул. Арбат, д. 10, кв. 25'
        client_comment:
          type: string
          example: 'Домофон 25К, после 18:00'
        delivery_cost:
          type: number
          example: 350
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/IncomingOrderItem'

    IncomingOrderItem:
      type: object
      required:
        - name
        - qty
      properties:
        name:
          type: string
          example: 'Смартфон Apple iPhone 15'
        sku:
          type: string
          example: 'IPH-15-128-BLK'
        qty:
          type: integer
          minimum: 1
          example: 1
        price:
          type: number
          example: 3200
        purchase_price:
          type: number
          description: Закупочная себестоимость единицы товара
          example: 2720
        external_variant_id:
          type: string
          description: Внешний ID торгового предложения (варианта) на сайте
          example: 'var-15-128-blk'
        external_product_id:
          type: string
          description: Внешний ID родительского товара на сайте
          example: 'prod-iphone-15'
        variant_title:
          type: string
          description: Название модификации/варианта
          example: '128GB Black'
        product_variant_id:
          type: integer
          description: Внутренний ID варианта в CRM
          example: 12
        product_id:
          type: integer
          description: Внутренний ID товара в CRM
          example: 5

    IncomingLeadRequest:
      type: object
      required:
        - client_phone
      properties:
        type:
          type: string
          enum: [callback, contact, question, one_click, consultation]
          default: callback
        client_phone:
          type: string
          example: '+79991234567'
        client_name:
          type: string
          example: 'Ольга'
        client_email:
          type: string
          example: 'olga@example.com'
        comment:
          type: string
          example: 'Перезвоните в течение 10 минут'
        page_url:
          type: string
          example: 'https://myshop.ru/catalog/item-12'
        product_name:
          type: string
          example: 'Кожаная куртка'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'AidSoul'
        telegram_id:
          type: integer
          example: 123456789
        role:
          type: string
          enum: [owner, manager, courier]
          example: owner
        is_active:
          type: boolean
          example: true

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 42
        external_id:
          type: string
          example: '10492'
        status:
          type: string
          enum: [new, accepted, at_warehouse, delivering, completed, cancelled]
          example: new
        total_amount:
          type: number
          example: 5340
        purchase_amount:
          type: number
          example: 2500
        delivery_cost:
          type: number
          example: 350
        profit:
          type: number
          example: 2490
        delivery_type:
          type: string
          enum: [courier, pickup, post]
          example: courier
        payment_method:
          type: string
          enum: [cash, card, online]
          example: cash
        payment_status:
          type: string
          enum: [pending, paid, refunded]
          example: pending
        is_valuable:
          type: boolean
          example: false
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        id:
          type: integer
          example: 101
        product_id:
          type: integer
          example: 7
        external_product_id:
          type: string
          example: 'prod-iphone-15'
        product_variant_id:
          type: integer
          example: 12
        external_variant_id:
          type: string
          example: 'var-15-128-blk'
        image_url:
          type: string
          example: 'https://example.com/images/iphone-black.png'
        url:
          type: string
          example: 'https://example.com/products/iphone-15'
        name:
          type: string
          example: 'Смартфон Apple iPhone 15'
        variant_title:
          type: string
          example: '128GB Black'
        sku:
          type: string
          example: 'IPH-15-128-BLK'
        qty:
          type: integer
          example: 1
        price:
          type: number
          example: 3200
        purchase_price:
          type: number
          description: Закупочная стоимость (скрыта для курьеров)
          example: 2720
        subtotal:
          type: number
          example: 3200

    OrderComment:
      type: object
      properties:
        id:
          type: integer
          example: 5
        author_name:
          type: string
          example: 'Менеджер Анна'
        text:
          type: string
          example: 'Клиент подтвердил доставку на вечер'
        created_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 15
        name:
          type: string
          example: 'Иван Иванов'
        phone:
          type: string
          example: '+79991234567'
        email:
          type: string
          example: 'ivan@example.com'
        address:
          type: string
          example: 'г. Москва, ул. Арбат, д. 10, кв. 25'
        orders_count:
          type: integer
          example: 3
        ltv:
          type: number
          example: 16020
        is_blacklisted:
          type: boolean
          example: false
        tags:
          type: array
          items:
            type: string
          example: ['VIP', 'Постоянный']

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 7
        site_id:
          type: integer
          example: 1
        external_id:
          type: string
          example: 'prod-iphone-15'
        name:
          type: string
          example: 'Смартфон Apple iPhone 15'
        sku:
          type: string
          example: 'IPH-15'
        description:
          type: string
          example: 'Флагманский смартфон с Dynamic Island и чипом A16 Bionic'
        image_url:
          type: string
          example: 'https://example.com/images/iphone15.jpg'
        url:
          type: string
          example: 'https://example.com/products/iphone-15'
        price:
          type: number
          example: 3200
        cost_price:
          type: number
          description: Закупочная стоимость (скрыта для курьеров)
          example: 2720
        margin:
          type: number
          description: Маржа единицы товара (скрыта для курьеров)
          example: 480
        is_active:
          type: boolean
          example: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        site:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Apple Store'
            domain:
              type: string
              example: 'apple.example.com'
            display_name:
              type: string
              example: 'Apple Store'
        created_at:
          type: string
          format: date-time

    ProductVariant:
      type: object
      properties:
        id:
          type: integer
          example: 12
        external_id:
          type: string
          example: 'var-15-128-blk'
        sku:
          type: string
          example: 'IPH-15-128-BLK'
        title:
          type: string
          example: '128GB Black'
        attributes:
          type: object
          example:
            color: 'Black'
            storage: '128GB'
        price:
          type: number
          example: 3200
        purchase_price:
          type: number
          description: Закупочная себестоимость варианта (скрыта для курьеров)
          example: 2720
        is_active:
          type: boolean
          example: true

    CatalogSyncRequest:
      type: object
      required:
        - products
      properties:
        async:
          type: boolean
          default: false
          description: Асинхронная фоновая обработка через очередь
          example: false
        products:
          type: array
          description: Список товаров интернет-магазина (до 500)
          items:
            $ref: '#/components/schemas/CatalogProductInput'

    CatalogProductInput:
      type: object
      required:
        - external_id
        - name
        - price
      properties:
        external_id:
          type: string
          description: Уникальный ID товара во внешней системе
          example: 'prod-iphone-15'
        name:
          type: string
          description: Наименование товара
          example: 'Смартфон Apple iPhone 15'
        sku:
          type: string
          example: 'IPH-15'
        price:
          type: number
          description: Розничная цена товара
          example: 3200
        cost_price:
          type: number
          description: Закупочная цена (себестоимость)
          example: 2720
        description:
          type: string
          description: Описание товара
          example: 'Флагманский смартфон с Dynamic Island'
        image_url:
          type: string
          description: Ссылка на изображение товара
          example: 'https://example.com/images/iphone15.jpg'
        url:
          type: string
          description: Прямая ссылка на страницу товара в магазине
          example: 'https://example.com/products/iphone-15'
        is_active:
          type: boolean
          default: true
          description: Флаг активности (false переводит в архив)
          example: true
        variants:
          type: array
          description: Список торговых предложений (модификаций)
          items:
            $ref: '#/components/schemas/ProductVariantInput'

    ProductVariantInput:
      type: object
      properties:
        external_id:
          type: string
          description: Уникальный ID варианта во внешней системе
          example: 'var-15-128-blk'
        sku:
          type: string
          description: Артикул варианта
          example: 'IPH-15-128-BLK'
        title:
          type: string
          description: Название модификации
          example: '128GB Black'
        price:
          type: number
          description: Розничная цена (если отличается от цены товара)
          example: 3200
        purchase_price:
          type: number
          description: Закупочная цена варианта
          example: 2720
        attributes:
          type: object
          description: Произвольные атрибуты (цвет, размер, память)
          example:
            color: 'Black'
            storage: '128GB'
        is_active:
          type: boolean
          default: true
          description: Флаг активности варианта
          example: true

    ProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        purchase_price:
          type: number
        is_active:
          type: boolean
          default: true

    Site:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Главный интернет-магазин'
        domain:
          type: string
          example: 'shop.example.com'
        token:
          type: string
          example: 'a4b12c8e-73df-4c28-98e3-0599c4c7810f'
        default_purchase_percent:
          type: number
          example: 15
        created_at:
          type: string
          format: date-time

    FinancialStats:
      type: object
      properties:
        revenue:
          type: number
          description: Общая выручка (оборот)
          example: 450000
        cost_of_goods:
          type: number
          description: Себестоимость товаров
          example: 210000
        delivery_payouts:
          type: number
          description: Расходы на доставку
          example: 35000
        net_profit:
          type: number
          description: Чистая прибыль
          example: 205000
        margin_percent:
          type: number
          example: 45.5
        orders_count:
          type: integer
          example: 124

    CreateOrderRequest:
      type: object
      required:
        - client_phone
        - order_items
      properties:
        client_phone:
          type: string
        client_name:
          type: string
        client_address:
          type: string
        delivery_type:
          type: string
          enum: [courier, pickup, post]
        delivery_cost:
          type: number
        courier_id:
          type: integer
        is_valuable:
          type: boolean
        is_valuable:
          type: boolean
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/IncomingOrderItem'

    UpdateOrderRequest:
      type: object
      properties:
        client_address:
          type: string
        delivery_type:
          type: string
        delivery_cost:
          type: number
        courier_id:
          type: integer
        is_valuable:
          type: boolean

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 68

